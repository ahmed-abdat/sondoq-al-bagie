<title>صندوق البقيع</title>
<meta name="theme-color" content="#237A3B">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Reem+Kufi:wght@500;600;700&display=swap">
<style>
:root{
  --bg:#EEF2EA;--stage:#E4EADF;--surface:#FFFFFF;--surface-2:#F2F5EE;--ink:#15241B;--muted:#5A695E;--line:#DCE3D6;
  --primary:#237A3B;--primary-ink:#FFFFFF;--primary-soft:#DDF0DF;--gold:#A87A00;--gold-bright:#E8B30E;--gold-soft:#F7EDD3;
  --ok:#1F8A55;--ok-soft:#DDF2E6;--warn:#A86A10;--warn-soft:#FBEFD9;--bad:#BE3326;--bad-soft:#F9E1DE;
  --shadow:0 1px 2px rgba(20,40,28,.06),0 6px 20px rgba(20,40,28,.07);--overlay:rgba(12,24,17,.42);
  --display:"Reem Kufi","IBM Plex Sans Arabic",Tahoma,sans-serif;
  --body:"IBM Plex Sans Arabic","Segoe UI",Tahoma,Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0B120E;--stage:#0E1611;--surface:#16211B;--surface-2:#1C2922;--ink:#E6EEE8;--muted:#9BAAA0;--line:#2A3930;
    --primary:#5CC46A;--primary-ink:#06170A;--primary-soft:#1B3A22;--gold:#E8BC3A;--gold-bright:#EDC24A;--gold-soft:#372E1B;
    --ok:#4CC486;--ok-soft:#163424;--warn:#E6A94A;--warn-soft:#382B16;--bad:#F0776A;--bad-soft:#3C1E1B;
    --shadow:0 1px 0 rgba(255,255,255,.03);--overlay:rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0B120E;--stage:#0E1611;--surface:#16211B;--surface-2:#1C2922;--ink:#E6EEE8;--muted:#9BAAA0;--line:#2A3930;
  --primary:#5CC46A;--primary-ink:#06170A;--primary-soft:#1B3A22;--gold:#E8BC3A;--gold-bright:#EDC24A;--gold-soft:#372E1B;
  --ok:#4CC486;--ok-soft:#163424;--warn:#E6A94A;--warn-soft:#382B16;--bad:#F0776A;--bad-soft:#3C1E1B;
  --shadow:0 1px 0 rgba(255,255,255,.03);--overlay:rgba(0,0,0,.6);
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--stage);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.6;padding-inline:16px;padding-block:12px;display:flex;flex-direction:column;align-items:center;gap:12px}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input,textarea,select{font:inherit;color:var(--ink)}
:focus-visible{outline:3px solid var(--gold-bright);outline-offset:2px;border-radius:10px}
.num{font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate;display:inline-block}

/* demo bar */
.demo{width:100%;max-width:440px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;font-size:13px;color:var(--muted)}
.demo b{color:var(--ink);font-weight:600}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px}
.seg button{padding:5px 12px;border-radius:999px;font-size:13px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--primary);color:var(--primary-ink)}
.tog{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-size:13px;font-weight:600}
.tog .dot{width:8px;height:8px;border-radius:50%;background:var(--ok)}
.tog[aria-pressed="true"] .dot{background:var(--bad)}

/* phone */
.phone{position:relative;width:100%;max-width:440px;height:min(880px,calc(100dvh - 76px));min-height:560px;background:var(--bg);border-radius:30px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 0 0 1px var(--line),0 30px 60px -20px rgba(10,30,20,.25)}
@media (max-width:480px){.phone{border-radius:20px}}
.appbar{display:flex;align-items:center;gap:10px;padding:14px 16px 10px;background:var(--bg)}
.appbar .t{flex:1;min-width:0}
.appbar h1{margin:0;font-family:var(--display);font-size:20px;font-weight:600;line-height:1.3}
.appbar small{display:block;color:var(--muted);font-size:12.5px}
.iconbtn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line)}
.iconbtn svg{width:20px;height:20px}
.offline{display:flex;gap:8px;align-items:center;margin:0 16px 8px;padding:8px 12px;border-radius:12px;background:var(--warn-soft);color:var(--warn);font-size:13.5px;font-weight:600}
.scroll>*{flex-shrink:0}
.scroll{flex:1;overflow-y:auto;overflow-x:hidden;padding:4px 16px 110px;display:flex;flex-direction:column;gap:14px;scroll-behavior:smooth}

/* nav */
.nav{position:absolute;inset-inline:0;bottom:0;display:flex;align-items:flex-end;justify-content:space-around;padding:8px 8px calc(10px + env(safe-area-inset-bottom,0px));background:color-mix(in srgb,var(--surface) 94%,transparent);backdrop-filter:blur(10px);border-top:1px solid var(--line)}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;font-size:12px;font-weight:600;color:var(--muted);position:relative;min-height:52px}
.nav button svg{width:24px;height:24px}
.nav button[aria-current="page"]{color:var(--primary)}
.nav .badge{position:absolute;top:2px;inset-inline-start:calc(50% + 4px);background:var(--bad);color:#fff;border-radius:999px;font-size:11px;min-width:18px;height:18px;display:grid;place-items:center;padding:0 5px}
.fab{flex:0 0 auto !important;width:60px;height:60px;min-height:60px !important;margin-top:-26px;border-radius:20px;background:var(--primary) !important;color:var(--primary-ink) !important;display:grid !important;place-items:center;box-shadow:0 8px 20px -6px rgba(30,107,71,.6)}
.fab svg{width:28px !important;height:28px !important}

/* cards */
.card{background:var(--surface);border-radius:20px;padding:16px;box-shadow:var(--shadow);border:1px solid var(--line)}
.card h2,.sec-h{margin:0;font-size:16px;font-weight:700}
.sec{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-top:4px}
.sec a,.link{color:var(--primary);font-weight:600;font-size:14px;cursor:pointer}
.muted{color:var(--muted)}
.small{font-size:13px}

.hero{background:var(--primary);color:var(--primary-ink);border-radius:24px;padding:18px 18px 16px;position:relative;overflow:hidden;border:0}
.hero::after{content:"";position:absolute;inset-inline-end:-40px;top:-40px;width:170px;height:170px;border-radius:50%;box-shadow:inset -26px 10px 0 0 var(--gold-bright);opacity:.9}
.hero .lbl{font-size:14px;opacity:.9}
.hero .big{font-family:var(--display);font-size:42px;line-height:1.15;font-weight:600;margin:4px 0 2px}
.hero .big small{font-family:var(--body);font-size:15px;font-weight:500;opacity:.9;margin-inline-start:6px}
.eq{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;font-size:12.5px}
.eq span{background:rgba(255,255,255,.14);padding:3px 9px;border-radius:999px}
:root[data-theme="dark"] .eq span{background:rgba(0,0,0,.15)}

.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:12px 14px;box-shadow:var(--shadow)}
.stat .v{font-family:var(--display);font-size:22px;font-weight:600;line-height:1.3}
.stat .k{font-size:13px;color:var(--muted)}
.stat .d{font-size:12px;font-weight:600;margin-top:2px}

.chip{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:999px;font-size:12.5px;font-weight:600;white-space:nowrap}
.chip svg{width:14px;height:14px}
.ok{background:var(--ok-soft);color:var(--ok)}
.warn{background:var(--warn-soft);color:var(--warn)}
.bad{background:var(--bad-soft);color:var(--bad)}
.neutral{background:var(--surface-2);color:var(--muted)}
.goldc{background:var(--gold-soft);color:var(--gold)}

/* bars */
.bars{display:flex;align-items:flex-end;gap:5px;height:130px;margin-top:12px;padding-bottom:20px;position:relative}
.bars .col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;position:relative}
.bars .exp{position:absolute;bottom:0;width:100%;border-radius:6px 6px 3px 3px;background:var(--surface-2);border:1px dashed var(--line)}
.bars .got{position:relative;width:100%;border-radius:6px 6px 3px 3px;background:var(--primary)}
.bars .col.fut .got{background:var(--gold-bright)}
.bars .m{position:absolute;bottom:-20px;font-size:11px;color:var(--muted)}
.bars .col.now .m{color:var(--ink);font-weight:700}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-inline-end:5px;vertical-align:-1px}

.donut-row{display:flex;gap:14px;align-items:center;margin-top:10px}
.donut-row ul{list-style:none;margin:0;padding:0;flex:1;display:flex;flex-direction:column;gap:6px;font-size:13.5px;min-width:0}
.donut-row li{display:flex;align-items:center;gap:8px}
.donut-row li i{width:10px;height:10px;border-radius:3px;flex:none}
.donut-row li span:nth-child(2){flex:1;min-width:0}
.donut-row li b{font-weight:600}

.prog{height:10px;border-radius:999px;background:var(--surface-2);overflow:hidden}
.prog>i{display:block;height:100%;border-radius:999px;background:var(--primary)}
.prog.gold>i{background:var(--gold-bright)}

.camp{display:flex;flex-direction:column;gap:8px;cursor:pointer}
.camp .row{display:flex;justify-content:space-between;gap:8px;font-size:13.5px}
.camp h3{margin:0;font-size:15.5px;font-weight:700}

.feed{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.feed li{display:flex;gap:10px;padding:10px 0;border-top:1px solid var(--line);align-items:flex-start}
.feed li:first-child{border-top:0}
.feed .ic{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;flex:none}
.feed .ic svg{width:18px;height:18px}
.feed .tx{flex:1;min-width:0;font-size:14px}
.feed .tx small{display:block;color:var(--muted);font-size:12px}

/* search + filters */
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:0 12px;height:48px}
.search input{flex:1;border:0;background:none;outline:none;font-size:16px;min-width:0}
.search svg{width:20px;height:20px;color:var(--muted)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips button{flex:none;padding:7px 14px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-size:14px;font-weight:600;color:var(--muted)}
.chips button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

.mlist{display:flex;flex-direction:column;gap:8px}
.mrow{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:10px 12px;text-align:start;width:100%}
.mrow .nm{flex:1;min-width:0}
.mrow .nm b{display:block;font-weight:600;font-size:15.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mrow .nm small{color:var(--muted);font-size:12.5px}
.mrow .end{display:flex;flex-direction:column;align-items:flex-end;gap:3px}
.ring{position:relative;width:46px;height:46px;flex:none}
.ring svg{width:46px;height:46px;transform:rotate(-90deg)}
.ring span{position:absolute;inset:0;display:grid;place-items:center;font-size:12px;font-weight:700}

/* heatmap */
.hm-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:16px}
.hm{border-collapse:separate;border-spacing:3px;font-size:12px;min-width:100%}
.hm th{font-weight:600;color:var(--muted);padding:4px 2px}
.hm td.n{white-space:nowrap;padding-inline:8px 6px;position:sticky;inset-inline-start:0;background:var(--surface);font-weight:500;max-width:130px;overflow:hidden;text-overflow:ellipsis}
.hm td.c{width:20px;height:20px;border-radius:5px}
.c-p{background:var(--ok)}
.c-o{background:var(--bad-soft);box-shadow:inset 0 0 0 1px var(--bad)}
.c-f{background:var(--surface-2)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 18px;border-radius:14px;font-weight:700;font-size:16px}
.btn svg{width:20px;height:20px}
.btn.p{background:var(--primary);color:var(--primary-ink)}
.btn.s{background:var(--surface);border:1px solid var(--line)}
.btn.d{background:var(--bad-soft);color:var(--bad)}
.btn.g{background:#1FA855;color:#fff}
.btn.sm{min-height:40px;font-size:14px;padding:0 14px;border-radius:12px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.block{width:100%}
.btns{display:flex;gap:10px}
.btns>.btn{flex:1}

/* quick actions */
.qa{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.qa button{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 4px;border-radius:16px;background:var(--surface);border:1px solid var(--line);font-size:12.5px;font-weight:600;line-height:1.3;text-align:center}
.qa .qi{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;background:var(--primary-soft);color:var(--primary)}
.qa .qi svg{width:22px;height:22px}
.alert{display:flex;align-items:center;gap:12px;background:var(--gold-soft);border-radius:18px;padding:14px;cursor:pointer;border:1px solid color-mix(in srgb,var(--gold) 30%,transparent)}
.alert .n{font-family:var(--display);font-size:30px;font-weight:700;color:var(--gold);line-height:1}
.alert .tx{flex:1;min-width:0}
.alert svg{width:22px;height:22px;flex:none}
.alert .tx b{display:block}

/* pending */
.pcard{display:flex;flex-direction:column;gap:12px}
.pcard .top{display:flex;gap:12px}
.proof{width:74px;height:110px;border-radius:12px;overflow:hidden;flex:none;border:1px solid var(--line);cursor:zoom-in;background:var(--surface-2)}
.proof svg,.proof img{width:100%;height:100%;display:block;object-fit:cover}
.pcard .info{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.pcard .amt{font-family:var(--display);font-size:24px;font-weight:600;line-height:1.2}
.lines{font-size:13.5px;display:flex;flex-direction:column;gap:2px}
.note{padding:10px 12px;border-radius:12px;font-size:14px;display:flex;gap:8px;align-items:flex-start}
.note svg{width:18px;height:18px;flex:none;margin-top:2px}

/* sheet */
.overlay{position:absolute;inset:0;background:var(--overlay);z-index:20;animation:fade .2s ease}
.sheet{position:absolute;inset-inline:0;bottom:0;max-height:88%;background:var(--bg);border-radius:26px 26px 0 0;z-index:21;display:flex;flex-direction:column;animation:up .26s cubic-bezier(.2,.8,.2,1)}
.sheet .grab{width:44px;height:5px;border-radius:9px;background:var(--line);margin:10px auto 4px}
.sheet .sh{display:flex;align-items:center;gap:10px;padding:6px 18px 10px}
.sheet .sh h2{flex:1;margin:0;font-size:19px;font-family:var(--display);font-weight:600}
.sheet .sb{overflow-y:auto;padding:0 18px calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
@keyframes up{from{transform:translateY(40%);opacity:.3}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}}
@media (prefers-reduced-motion:reduce){.sheet,.overlay,.toast{animation:none !important}.scroll{scroll-behavior:auto}}

/* months timeline */
.months{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.mo{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;color:var(--muted)}
.mo i{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-style:normal}
.mo i svg{width:18px;height:18px}
.mo.p i{background:var(--ok);color:#fff}
.mo.o i{background:var(--bad-soft);color:var(--bad);border:1.5px solid var(--bad)}
.mo.f i{background:var(--surface-2);border:1.5px dashed var(--line)}
.mo.s i{background:var(--gold-bright);color:#231a00}
button.mo{padding:0}
button.mo[disabled]{cursor:default}

/* form */
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-weight:600;font-size:14px}
.field input,.field textarea{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;font-size:16px;outline:none;width:100%}
.field input:focus,.field textarea:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
.opts{display:grid;gap:8px}
.opt{display:flex;align-items:center;gap:12px;padding:14px;border-radius:16px;background:var(--surface);border:1.5px solid var(--line);text-align:start;width:100%}
.opt[aria-pressed="true"]{border-color:var(--primary);background:var(--primary-soft)}
.opt .oi{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--surface-2);flex:none}
.opt[aria-pressed="true"] .oi{background:var(--primary);color:var(--primary-ink)}
.opt .oi svg{width:20px;height:20px}
.opt b{display:block;font-size:15px}
.opt small{color:var(--muted);font-size:13px}
.pillset{display:flex;flex-wrap:wrap;gap:8px}
.pill{padding:9px 14px;border-radius:12px;background:var(--surface);border:1.5px solid var(--line);font-weight:600;font-size:14.5px}
.pill[aria-pressed="true"]{border-color:var(--primary);background:var(--primary-soft);color:var(--primary)}
.upload{display:flex;align-items:center;gap:12px;padding:14px;border-radius:16px;border:2px dashed var(--line);background:var(--surface);cursor:pointer}
.upload input{position:absolute;width:1px;height:1px;opacity:0}
.upload .th{width:52px;height:70px;border-radius:10px;overflow:hidden;background:var(--surface-2);display:grid;place-items:center;flex:none}
.upload .th img{width:100%;height:100%;object-fit:cover}

.stepper{display:flex;gap:6px;padding:0 16px 8px}
.stepper i{flex:1;height:5px;border-radius:9px;background:var(--line)}
.stepper i.on{background:var(--primary)}
.flowfoot{position:absolute;inset-inline:0;bottom:0;padding:12px 16px calc(14px + env(safe-area-inset-bottom,0px));background:color-mix(in srgb,var(--bg) 94%,transparent);backdrop-filter:blur(10px);border-top:1px solid var(--line);display:flex;gap:10px;align-items:center}
.flowfoot .tot{flex:1}
.flowfoot .tot small{display:block;color:var(--muted);font-size:12px}
.flowfoot .tot b{font-family:var(--display);font-size:22px;font-weight:600}
.sel{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:14px;background:var(--surface);border:1.5px solid var(--line);width:100%;text-align:start}
.sel[aria-pressed="true"]{border-color:var(--primary);background:var(--primary-soft)}
.box{width:24px;height:24px;border-radius:8px;border:2px solid var(--line);display:grid;place-items:center;flex:none;background:var(--surface)}
.sel[aria-pressed="true"] .box{background:var(--primary);border-color:var(--primary);color:var(--primary-ink)}
.box svg{width:16px;height:16px}
.selchips{display:flex;flex-wrap:wrap;gap:6px}
.mcard{display:flex;flex-direction:column;gap:10px}
.mcard .hd{display:flex;justify-content:space-between;align-items:center;gap:8px}
.done{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:30px 8px}
.done .ck{width:84px;height:84px;border-radius:28px;background:var(--ok);color:#fff;display:grid;place-items:center}
.done .ck svg{width:44px;height:44px}
.done h2{font-family:var(--display);font-size:24px;margin:6px 0 0;font-weight:600}
.wa{background:#E7F7EC;color:#0f3d24;border-radius:16px 16px 4px 16px;padding:12px 14px;font-size:14.5px;white-space:pre-line;border:1px solid #cdebd7}
:root[data-theme="dark"] .wa{background:#12301f;color:#d6f0de;border-color:#1d4a31}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .wa{background:#12301f;color:#d6f0de;border-color:#1d4a31}}

.toast{position:absolute;inset-inline:16px;bottom:96px;z-index:40;background:var(--ink);color:var(--bg);border-radius:14px;padding:12px 14px;display:flex;align-items:center;gap:10px;font-size:14.5px;animation:up .22s ease}
.toast .tx{flex:1}
.toast button{color:var(--gold-bright);font-weight:700}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kv div{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.kv small{display:block;color:var(--muted);font-size:12.5px}
.kv b{font-family:var(--display);font-size:19px;font-weight:600}
.hist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.hist li{display:flex;justify-content:space-between;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px;font-size:14px}
.hist li small{display:block;color:var(--muted);font-size:12px}
.tabs2{display:flex;background:var(--surface-2);border-radius:12px;padding:3px}
.tabs2 button{flex:1;padding:8px;border-radius:10px;font-weight:600;font-size:14px;color:var(--muted)}
.tabs2 button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.steps{counter-reset:s;list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.steps li{display:flex;gap:12px;align-items:flex-start}
.steps li::before{counter-increment:s;content:counter(s);width:28px;height:28px;border-radius:9px;background:var(--primary-soft);color:var(--primary);display:grid;place-items:center;font-weight:700;flex:none;font-size:14px}
.copyline{display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--surface-2);border-radius:12px;padding:8px 12px;margin-top:6px}
.brand{width:44px;height:44px;flex:none;border-radius:50%;background:#fff;object-fit:contain;box-shadow:0 0 0 1px var(--line)}
.splash{position:absolute;inset:0;z-index:60;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:24px;transition:opacity .4s ease}
.splash img{width:168px;height:168px;border-radius:50%;background:#fff;object-fit:contain;box-shadow:0 12px 30px -10px rgba(35,122,59,.45)}
.splash h2{margin:0;font-family:var(--display);font-size:26px;font-weight:600}
.splash p{margin:0;color:var(--muted)}
.splash .tag{color:var(--gold);font-weight:700;letter-spacing:.02em}
.splash.gone{opacity:0;pointer-events:none}
.empty{text-align:center;color:var(--muted);padding:30px 10px;font-size:14px}

function donut(parts,size){const r=size/2-9,c=2*Math.PI*r,tot=parts.reduce((s,p)=>s+p.v,0)||1;let off=0;return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" style="flex:none;transform:rotate(-90deg)"><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--surface-2)" stroke-width="16"/>${parts.map(p=>{const l=c*p.v/tot;const s=`<circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${p.c}" stroke-width="16" stroke-dasharray="${Math.max(l-2,0)} ${c}" stroke-dashoffset="${-off}"/>`;off+=l;return s}).join('')}</svg>`}
function proofSVG(amt,meth){return `<svg viewBox="0 0 74 110" aria-label="لقطة شاشة التحويل"><rect width="74" height="110" fill="#F4F7F5"/><rect x="0" y="0" width="74" height="16" fill="#1F7A52"/><text x="37" y="11" fill="#fff" font-size="7" text-anchor="middle" font-family="sans-serif">${meth}</text><circle cx="37" cy="36" r="11" fill="#22A06B"/><path d="m31 36 4 4 8-8" stroke="#fff" stroke-width="2.4" fill="none" stroke-linecap="round"/><text x="37" y="60" font-size="6.5" text-anchor="middle" fill="#333" font-family="sans-serif">تم التحويل</text><text x="37" y="74" font-size="10" font-weight="700" text-anchor="middle" fill="#111" font-family="sans-serif">${amt.toLocaleString('en-US')}</text><rect x="10" y="84" width="54" height="3" rx="1.5" fill="#D5DDD8"/><rect x="14" y="92" width="46" height="3" rx="1.5" fill="#D5DDD8"/></svg>`}
function monthsGrid(m,opts){opts=opts||{};return `<div class="months">${MN.map((mn,i)=>{const p=m.paid[i],sel=opts.sel&&opts.sel.has(i+1);const cls=p?'p':(sel?'s':(i<CUR?'o':'f'));const inner=p?I.check:(sel?I.check:(i<CUR?'!':''));const tag=opts.pick?'button':'div';return `<${tag} class="mo ${cls}" ${opts.pick?`data-act="pickm" data-arg="${m.id}:${i+1}" ${p?'disabled':''} aria-pressed="${!!sel}"`:''}><i>${inner}</i>${mn.slice(0,5)}</${tag}>`}).join('')}</div>`}
function stChip(m){const s=status(m);return `<span class="chip ${s.c}">${s.ic}${s.l}</span>`}

function flowPay(){
  const F=S.flow;const st=F.step;
  const subs=Object.entries(F.months).reduce((s,[id,set])=>s+set.size*PRICE[byId(+id).g],0);const donA=F.don.c?(+F.don.amt||0):0;const total=subs+donA;const shotOld=F.ext&&!F.manual?F.ext.amt*10:(+F.shot||0)*(F.unit==='new'?10:1);
  let body='',title=['عن من هذه الدفعة؟','أي الأشهر؟','الوسيلة والإثبات','راجع قبل الحفظ'][st];

  if(st===0){const q=F.q||'';const list=members.filter(m=>!q||m.name.includes(q)||String(m.n)===q).slice(0,40);
    body=`${F.sel.length?`<div class="selchips">${F.sel.map(id=>`<span class="chip ok">${esc(byId(id).name)}</span>`).join('')}</div>`:'<p class="muted small" style="margin:0">اختر عضوًا أو أكثر. يمكن أن يدفع شخص عن نفسه وعن أخيه أو قريبه معًا.</p>'}
    <label class="search">${I.search}<input id="fq" type="search" placeholder="ابحث بالاسم أو الرقم" value="${esc(q)}" data-in="fq" autocomplete="off"></label>
    <div class="mlist">${list.map(m=>`<button class="sel" data-act="selm" data-arg="${m.id}" aria-pressed="${F.sel.includes(m.id)}"><span class="box">${F.sel.includes(m.id)?I.check:''}</span><span class="nm" style="flex:1;min-width:0"><b style="font-weight:600">${esc(m.name)}</b><br><small class="muted">رقم ${m.n} • الفئة ${m.g}</small></span>${stChip(m)}</button>`).join('')}</div>`}
  if(st===1){body=F.sel.map(id=>{const m=byId(id),set=F.months[id];const ow=owedMonths(m);return `<section class="card mcard"><div class="hd"><div><b>${esc(m.name)}</b><div class="small muted">الفئة ${m.g} • ${fmt(PRICE[m.g])} للشهر</div></div><b>${fmt(set.size*PRICE[m.g])}</b></div>
     <div class="pillset"><button class="pill" data-act="quick" data-arg="${id}:late" ${ow.length?'':'disabled'}>المتأخرة (${ow.length})</button><button class="pill" data-act="quick" data-arg="${id}:year">كل ما بقي من السنة</button><button class="pill" data-act="quick" data-arg="${id}:clear">مسح</button></div>
     ${monthsGrid(m,{pick:true,sel:set})}</section>`}).join('')+`<div class="legend"><span><i style="background:var(--ok)"></i>مدفوع سابقًا</span><span><i style="background:var(--gold-bright)"></i>في هذه الدفعة</span><span><i style="background:var(--bad-soft);box-shadow:inset 0 0 0 1px var(--bad)"></i>متأخر</span></div>
     <section class="card mcard"><div class="hd"><div><b>هل جزء من التحويل لتبرع؟</b><div class="small muted">مثلًا 6000 للاشتراك و2000 لتبرع الفريق، بلقطة شاشة واحدة</div></div></div><div class="pillset"><button class="pill" data-act="don" data-arg="0" aria-pressed="${!F.don.c}">لا</button>${campaigns.filter(c=>c.status==='open').map(c=>`<button class="pill" data-act="don" data-arg="${c.id}" aria-pressed="${F.don.c===c.id}">${esc(c.title)}</button>`).join('')}</div>${F.don.c?`<div class="field"><label for="da">مبلغ المساهمة (أوقية قديمة)</label><input id="da" data-in="da" inputmode="numeric" value="${esc(F.don.amt)}" placeholder="2000"></div>`:''}</section>`}
  if(st===2){const X=F.ext;const shotOld=X&&!F.manual?X.amt*10:(+F.shot||0)*(F.unit==='new'?10:1);const refv=X&&!F.manual?X.id:F.ref;const dup=refv==='48213'||(F.dupDemo&&X);
    const upl=`<div class="field"><label>لقطة شاشة التحويل</label><label class="upload"><input type="file" accept="image/*" id="file" data-file="1"><span class="th">${F.img?`<img src="${F.img}" alt="">`:I.image}</span><span><b>${F.img?'تم إرفاق الصورة':'أرفق لقطة الشاشة'}</b><br><small class="muted">${F.img?'اضغط لتغييرها':'نقرأ منها المبلغ ورقم العملية تلقائيًا'}</small></span></label>${F.img?'':`<button class="btn s sm" data-act="sample" style="align-self:flex-start">${I.image}جرّب بلقطة مثال</button>`}</div>`;
    const card=X?`<section class="card" style="display:flex;flex-direction:column;gap:10px"><div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><b>قرأنا من لقطة الشاشة</b><span class="chip neutral">${X.app}</span></div>
      <div class="hist" style="display:flex;flex-direction:column;gap:6px">
       <div style="display:flex;justify-content:space-between;gap:8px"><span class="muted">المبلغ</span><span><b class="num">${X.amt} MRU</b> = ${fmt(X.amt*10)} قديمة ${X.amt*10===total?`<span class="chip ok">${I.check}يطابق</span>`:''}</span></div>
       <div style="display:flex;justify-content:space-between;gap:8px"><span class="muted">رقم العملية</span><span class="num" style="font-size:13.5px">…${X.id.slice(-6)}</span></div>
       <div style="display:flex;justify-content:space-between;gap:8px"><span class="muted">التاريخ</span><span class="num">${X.date}</span></div>
       <div style="display:flex;justify-content:space-between;gap:8px"><span class="muted">المستفيد</span><span><span class="num">${X.ben}</span> <span class="chip ok">${I.check}رقم الصندوق</span></span></div></div>
      <button class="link" data-act="manual" style="align-self:flex-start">${F.manual?'إخفاء التعديل':'فيها خطأ؟ عدّل يدويًا'}</button>
      <button class="link small" data-act="dupdemo" style="align-self:flex-start;color:var(--muted)">محاكاة: نفس لقطة الشاشة أُرسلت من قبل</button></section>`:(F.reading?`<div class="note neutral">${I.info}<span>نقرأ لقطة الشاشة…</span></div>`:'');
    const manual=(!X||F.manual)?`<div class="field"><label for="shot">المبلغ كما يظهر في لقطة الشاشة</label><div style="display:flex;gap:8px"><input id="shot" data-in="shot" inputmode="numeric" value="${esc(F.shot)}" placeholder="${F.unit==='new'?total/10:total}" style="flex:1"><div class="seg" role="group" aria-label="العملة"><button data-act="unit" data-arg="new" aria-pressed="${F.unit==='new'}">جديدة</button><button data-act="unit" data-arg="old" aria-pressed="${F.unit==='old'}">قديمة</button></div></div>${F.shot?`<small class="muted">= ${fmt(shotOld)} أوقية قديمة</small>`:'<small class="muted">المحافظ تعرض الأوقية الجديدة. 1 جديدة = 10 قديمة.</small>'}</div>
     <div class="field"><label for="ref">آخر 6 أرقام من رقم العملية</label><input id="ref" data-in="ref" inputmode="numeric" maxlength="6" value="${esc(F.ref)}" placeholder="اختياري • جرّب 48213"></div>`:'';
    const warn=(shotOld&&shotOld!==total?(shotOld*10===total||shotOld===total*10?`<div class="note warn">${I.warn}<span>المبلغ لا يطابق المجموع ${fmt(total)}. هل اخترت العملة الخطأ؟</span></div>`:shotOld>total?`<div class="note goldc">${I.coins}<span>المبلغ أكبر من المجموع بـ ${fmt(shotOld-total)}. سيُسجَّل رصيدًا للعضو يُخصم من دفعته القادمة.</span></div>`:`<div class="note bad">${I.warn}<span>المبلغ أقل من المجموع بـ ${fmt(total-shotOld)}. قلّل الأشهر أو صحّح المبلغ.</span></div>`):'')+(dup?`<div class="note bad">${I.warn}<span>رقم العملية هذا مسجّل من قبل في دفعة 12 سبتمبر. غالبًا نفس لقطة الشاشة أُرسلت مرتين.</span></div>`:'');
    body=upl+card+warn+manual+`<div class="field"><label>وسيلة الدفع</label><div class="pillset">${['بنكيلي','مصرفي','سداد','نقدًا','أخرى'].map(x=>`<button class="pill" data-act="meth" data-arg="${x}" aria-pressed="${F.meth===x}">${x}</button>`).join('')}</div></div>
    <div class="field"><label for="payer">اسم الدافع</label><input id="payer" data-in="payer" value="${esc(F.payer)}"></div>
    <div class="field"><label for="pnote">ملاحظة (اختياري)</label><input id="pnote" data-in="pnote" value="${esc(F.note||'')}" placeholder="مثال: دفع عن أخيه"></div>`}
  if(st===3){body=`<section class="card"><div class="lines" style="gap:8px">${F.sel.map(id=>{const m=byId(id),set=[...F.months[id]].sort((a,b)=>a-b);return `<div style="display:flex;justify-content:space-between;gap:8px"><span><b>${esc(m.name)}</b><br><small class="muted">${set.length===12?'السنة كاملة':set.map(x=>MN[x-1]).join('، ')}</small></span><b>${fmt(set.length*PRICE[m.g])}</b></div>`}).join('<hr style="border:0;border-top:1px solid var(--line);margin:0">')}${F.don.c&&donA?`<hr style="border:0;border-top:1px solid var(--line);margin:0"><div style="display:flex;justify-content:space-between;gap:8px"><span><b>مساهمة في تبرع</b><br><small class="muted">${esc(campaigns.find(c=>c.id===F.don.c).title)}</small></span><b>${fmt(donA)}</b></div>`:''}${shotOld>total?`<hr style="border:0;border-top:1px solid var(--line);margin:0"><div style="display:flex;justify-content:space-between;gap:8px"><span><b>رصيد للعضو</b></span><b style="color:var(--gold)">${fmt(shotOld-total)}</b></div>`:''}</div></section>
    <div class="kv"><div><small>الوسيلة</small><b style="font-size:16px">${F.meth}</b></div><div><small>الدافع</small><b style="font-size:16px">${esc(F.payer)}</b></div></div>
    <div class="note ok">${I.check}<span>لأنك أمين الصندوق ستُحفظ الدفعة مؤكدة مباشرة. لو سجّلها مشرف آخر لبقيت بانتظار تأكيدك.</span></div>
    ${F.img?'':`<div class="note warn">${I.warn}<span>لم تُرفق لقطة شاشة. يمكنك الحفظ، لكن يُفضّل إرفاقها.</span></div>`}`}
  const canNext=st===0?F.sel.length>0:st===1?total>0:true;
  return `<div class="appbar"><button class="iconbtn" data-act="${st?'fstep':'close'}" data-arg="-1" aria-label="رجوع">${st?I.back:I.x}</button><div class="t"><h1>${title}</h1><small>تسجيل دفعة • الخطوة ${st+1} من 4</small></div></div>
   <div class="stepper">${[0,1,2,3].map(i=>`<i class="${i<=st?'on':''}"></i>`).join('')}</div>
   <div class="scroll" id="sc">${body}</div>
   <div class="flowfoot"><div class="tot"><small>المجموع</small><b>${fmt(total)}</b></div><button class="btn p" data-act="${st<3?'fstep':'save'}" data-arg="1" ${canNext&&!S.offline?'':'disabled'}>${st<3?'التالي':'حفظ الدفعة'}</button></div>`;
}

function flowCamp(){
  const F=S.flow,st=F.step;const titles=['ما الغرض؟','من يساهم؟','كم يدفع كل شخص؟','راجع قبل الإنشاء'];
  const parts=F.who==='all'?members:F.who==='group'?members.filter(m=>m.g===F.grp):members.filter(m=>F.pick.includes(m.id));
  const expT=F.mode==='fixed'?parts.length*(+F.fixed||0):F.mode==='per_group'?parts.reduce((s,m)=>s+(+F.pg[m.g]||0),0):F.mode==='custom'?parts.length*2000:0;
  let body='';
  if(st===0)body=`<div class="field"><label for="ct">عنوان التبرع</label><input id="ct" data-in="ct" value="${esc(F.title)}" placeholder="مثال: تجهيز الفريق الرياضي"></div>
   <div class="field"><label for="cp">الغرض</label><textarea id="cp" data-in="cp" rows="2" placeholder="لماذا نجمع هذا المبلغ؟">${esc(F.purpose)}</textarea></div>
   <div class="field"><label for="cg">المبلغ المستهدف (أوقية)</label><input id="cg" data-in="cg" inputmode="numeric" value="${esc(F.target)}"></div>
   <div class="field"><label for="cd">آخر موعد (اختياري)</label><input id="cd" data-in="cd" value="${esc(F.deadline)}" placeholder="مثال: 30 أكتوبر"></div>`;
  if(st===1)body=`<div class="opts">${[['all',I.all,'الجميع','كل الأعضاء ('+members.length+')'],['group',I.tag,'فئة واحدة','A أو B'],['pick',I.pick,'أشخاص محددون','تختارهم بالاسم']].map(([k,i,b,s])=>`<button class="opt" data-act="cwho" data-arg="${k}" aria-pressed="${F.who===k}"><span class="oi">${i}</span><span><b>${b}</b><small>${s}</small></span></button>`).join('')}</div>
   ${F.who==='group'?`<div class="pillset">${['A','B'].map(g=>`<button class="pill" data-act="cgrp" data-arg="${g}" aria-pressed="${F.grp===g}">الفئة ${g} (${members.filter(m=>m.g===g).length})</button>`).join('')}</div>`:''}
   ${F.who==='pick'?`<div class="mlist">${members.slice(0,25).map(m=>`<button class="sel" data-act="cpick" data-arg="${m.id}" aria-pressed="${F.pick.includes(m.id)}"><span class="box">${F.pick.includes(m.id)?I.check:''}</span><span style="flex:1">${esc(m.name)}</span><small class="muted">${m.g}</small></button>`).join('')}</div>`:''}`;
  if(st===2)body=`<div class="opts">${[['fixed','مبلغ ثابت للجميع','كل مساهم يدفع المبلغ نفسه'],['per_group','مبلغ لكل فئة','مثلًا A بـ 2000 و B بـ 1000'],['custom','مبلغ لكل شخص','تحدده لكل اسم على حدة'],['open','مبلغ حر','كلٌّ حسب قدرته، بدون مبلغ مطلوب']].map(([k,b,s])=>`<button class="opt" data-act="cmode" data-arg="${k}" aria-pressed="${F.mode===k}"><span class="oi">${I.coins}</span><span><b>${b}</b><small>${s}</small></span></button>`).join('')}</div>
   ${F.mode==='fixed'?`<div class="field"><label for="cf">المبلغ لكل شخص</label><input id="cf" data-in="cf" inputmode="numeric" value="${esc(F.fixed)}"></div>`:''}
   ${F.mode==='per_group'?`<div class="kv"><div class="field"><label for="pa">الفئة A</label><input id="pa" data-in="pa" inputmode="numeric" value="${esc(F.pg.A)}"></div><div class="field"><label for="pb">الفئة B</label><input id="pb" data-in="pb" inputmode="numeric" value="${esc(F.pg.B)}"></div></div>`:''}
   ${F.mode==='custom'?`<div class="note neutral">${I.info}<span>بعد الإنشاء تظهر قائمة المساهمين وتكتب أمام كل اسم مبلغه.</span></div>`:''}`;
  if(st===3){const pct=F.target?Math.min(100,Math.round(expT/+F.target*100)):0;body=`<section class="card camp"><h3>${esc(F.title||'بدون عنوان')}</h3><p class="muted small" style="margin:0">${esc(F.purpose||'')}</p>
   <div class="kv"><div><small>المستهدف</small><b>${fmt(+F.target||0)}</b></div><div><small>المساهمون</small><b>${parts.length}</b></div></div>
   ${F.mode!=='open'&&F.mode!=='custom'?`<div class="small">لو دفع الجميع: ${fmt(expT)} (${pct}٪ من المستهدف)</div><div class="prog gold"><i style="width:${pct}%"></i></div>${expT<+F.target?`<div class="note warn">${I.warn}<span>المبلغ المطلوب من المساهمين أقل من المستهدف بـ ${fmt(+F.target-expT)}. يمكن قبول تبرعات حرة إضافية.</span></div>`:''}`:''}</section>
   <button class="opt" data-act="cann" aria-pressed="${F.announce}"><span class="oi">${I.wa}</span><span><b>جهّز رسالة إعلان للمجموعة</b><small>تُفتح في واتساب بعد الإنشاء</small></span></button>`}
  const ok=st===0?(F.title&&+F.target>0):st===1?(F.who!=='pick'||F.pick.length):true;
  return `<div class="appbar"><button class="iconbtn" data-act="${st?'fstep':'close'}" data-arg="-1" aria-label="رجوع">${st?I.back:I.x}</button><div class="t"><h1>${titles[st]}</h1><small>تبرع جديد • الخطوة ${st+1} من 4</small></div></div>
   <div class="stepper">${[0,1,2,3].map(i=>`<i class="${i<=st?'on':''}"></i>`).join('')}</div>
   <div class="scroll" id="sc">${body}</div>
   <div class="flowfoot"><div class="tot"><small>المستهدف</small><b>${fmt(+F.target||0)}</b></div><button class="btn p" data-act="${st<3?'fstep':'csave'}" data-arg="1" ${ok&&!S.offline?'':'disabled'}>${st<3?'التالي':'إنشاء التبرع'}</button></div>`;
}

    ${m.credit?`<div class="note goldc">${I.coins}<span>له رصيد ${fmt(m.credit)} أوقية من دفعة سابقة، يُخصم تلقائيًا من دفعته القادمة.</span></div>`:''}${m.st!=='active'?`<div class="note neutral">${I.info}<span>${m.st==='left'?'انسحب في يونيو. تتوقف المتأخرات من تاريخ انسحابه.':'لا تُحسب عليه متأخرات خلال هذه الفترة بقرار اللجنة.'}</span></div>`:''}<div class="kv"><div><small>مدفوع ${YEAR}</small><b>${p} ${p===1?'شهر':'أشهر'}</b></div><div><small>المتأخرات</small><b style="color:var(--${owed(m)?'bad':'ok'})">${fmt(owed(m))}</b></div></div>

/* ---------- render ---------- */
const phone=document.getElementById('phone');
function render(keep){
  const act=document.activeElement;const fid=act&&act.id&&phone.contains(act)?act.id:null;const pos=fid&&act.selectionStart!=null?act.selectionStart:null;
  const sc=document.getElementById('sc');const top=keep&&sc?sc.scrollTop:0;
  let main;
  if(S.flow){main=S.flow.type==='pay'?flowPay():S.flow.type==='camp'?flowCamp():flowExp()}
  else if(S.role==='member'){main={home:homeMember,members:membersScreen,camps:campsScreen,more:moreScreen}[S.tab]()}
  else{main={home:homeCommittee,pending:pendingScreen,members:membersScreen,arrears:arrearsScreen,camps:campsScreen}[S.tab]()}
  const off=S.offline?`<div class="offline">${I.cloudoff}<span>غير متصل. تعرض آخر نسخة محفوظة (قبل ساعتين). التسجيل يحتاج إلى الإنترنت.</span></div>`:'';
  // put offline banner after appbar
  main=main.replace(/(<\/div>)(\s*<div class="(?:scroll|stepper)")/, '$1'+off+'$2');
  phone.innerHTML=main+nav()+(S.sheet?sheetHTML():'')+(S.toast?`<div class="toast" role="status"><span class="tx">${S.toast.t}</span>${S.toast.undo?`<button data-act="undo">تراجع</button>`:''}</div>`:'');
  const nsc=document.getElementById('sc');if(nsc&&keep)nsc.scrollTop=top;
  if(fid){const el=document.getElementById(fid);if(el){el.focus();if(pos!=null&&el.setSelectionRange)try{el.setSelectionRange(pos,pos)}catch(e){}}}
  document.getElementById('r-member').setAttribute('aria-pressed',S.role==='member');
  document.getElementById('r-committee').setAttribute('aria-pressed',S.role==='committee');
  document.getElementById('t-off').setAttribute('aria-pressed',S.offline);
  document.getElementById('t-off-l').textContent=S.offline?'بدون إنترنت':'متصل';
}
let tt;function toast(t,undo){S.toast={t,undo};render(true);clearTimeout(tt);tt=setTimeout(()=>{S.toast=null;S.undo=null;render(true)},undo?5000:2600)}

function flowTotal(){const F=S.flow;return Object.entries(F.months).reduce((s,[id,set])=>s+set.size*PRICE[byId(+id).g],0)+(F.don&&F.don.c?(+F.don.amt||0):0)}

/* ---------- actions ---------- */
document.addEventListener('click',e=>{

      break;
    case 'flowfor':{const m=byId(+g);S.sheet=null;S.flow={type:'pay',step:1,sel:[m.id],months:{[m.id]:new Set(owedMonths(m))},meth:'بنكيلي',payer:m.name,img:null,q:'',don:{c:0,amt:''},shot:'',unit:'new',ref:''};break}

    case 'selm':{const F=S.flow,id=+g;const i=F.sel.indexOf(id);if(i>=0){F.sel.splice(i,1);delete F.months[id]}else{F.sel.push(id);F.months[id]=new Set(owedMonths(byId(id)))}if(!F.payer&&F.sel.length)F.payer=byId(F.sel[0]).name;render(true);return}

    case 'quick':{const [id,k]=g.split(':');const m=byId(+id);const s=S.flow.months[id];s.clear();if(k==='late')owedMonths(m).forEach(x=>s.add(x));if(k==='year')m.paid.forEach((p,i)=>{if(!p)s.add(i+1)});render(true);return}
    case 'meth':S.flow.meth=g;render(true);return;

    case 'save':{const F=S.flow;let tot=0;F.sel.forEach(id=>{const m=byId(id);const ms=[...F.months[id]];ms.forEach(x=>m.paid[x-1]=true);tot+=ms.length*PRICE[m.g];if(ms.length){ms.sort((p,q)=>p-q);m.hist.push({months:[ms[0],ms[ms.length-1]],amt:ms.length*PRICE[m.g],meth:F.meth,date:'اليوم'})}});if(F.don.c&&+F.don.amt){const c=campaigns.find(x=>x.id===F.don.c);const pp=c.parts.find(x=>x.id===F.sel[0]);if(pp)pp.paid+=+F.don.amt;else c.extra.push({name:F.payer,amt:+F.don.amt});tot+=+F.don.amt}const so=F.ext&&!F.manual?F.ext.amt*10:(+F.shot||0)*(F.unit==='new'?10:1);if(so>tot){byId(F.sel[0]).credit+=so-tot}F.saved=tot;F.done=true;feed.unshift({ic:'ok',i:I.check,t:'تأكيد دفعة • '+tot.toLocaleString('en-US'),s:'الآن'});break}
    case 'confirm':{const p=pending.find(x=>x.id===g);if(p.conflict){p.state='conflict';render(true);return}p.state='confirmed';p.items.forEach(it=>it.months.forEach(x=>byId(it.id).paid[x-1]=true));S.undo=p.id;feed.unshift({ic:'ok',i:I.check,t:'تأكيد دفعة • '+pAmt(p).toLocaleString('en-US'),s:'الآن'});toast('تم تأكيد '+pAmt(p).toLocaleString('en-US')+' أوقية',true);return}
    case 'undo':{const p=pending.find(x=>x.id===S.undo);if(p){p.state='pending';p.items.forEach(it=>it.months.forEach(x=>byId(it.id).paid[x-1]=false));feed.shift()}S.toast=null;S.undo=null;break}
    case 'rejr':S.rej=g;render(true);return;
    case 'reject':{const p=pending.find(x=>x.id===g);p.state='rejected';p.reason=S.rej;S.sheet=null;toast('رُفضت الدفعة');return}
    case 'remind':{const m=byId(+g);m.rem='اليوم';S.sheet=null;toast('سُجّل التذكير. في التطبيق الحقيقي يُفتح واتساب بالرسالة جاهزة.');return}
    case 'sendgroup':S.sheet=null;toast('سُجّل الإرسال بتاريخ اليوم. في التطبيق الحقيقي يُفتح واتساب.');return;
    case 'cwho':S.flow.who=g;render(true);return;
    case 'cgrp':S.flow.grp=g;render(true);return;
    case 'cpick':{const P=S.flow.pick,id=+g,i=P.indexOf(id);i>=0?P.splice(i,1):P.push(id);render(true);return}
    case 'cmode':S.flow.mode=g;render(true);return;
    case 'cann':S.flow.announce=!S.flow.announce;render(true);return;
    case 'csave':{const F=S.flow;const parts=F.who==='all'?members:F.who==='group'?members.filter(m=>m.g===F.grp):members.filter(m=>F.pick.includes(m.id));const id=campaigns.length+1;
      const amounts={A:+F.pg.A||0,B:+F.pg.B||0};
      campaigns.unshift({id,title:F.title,purpose:F.purpose,target:+F.target,mode:F.mode,amounts,fixed:F.fixed,who:F.who,deadline:F.deadline||'بدون موعد',status:'open',parts:F.mode==='open'?[]:parts.map(m=>({id:m.id,exp:F.mode==='fixed'?+F.fixed:F.mode==='per_group'?amounts[m.g]:2000,paid:0})),extra:[]});
      feed.unshift({ic:'goldc',i:I.heart,t:'تبرع جديد: '+esc(F.title),s:'الآن'});S.flow=null;S.tab='camps';S.sheet=F.announce?'cann:'+id:'camp:'+id;break}
    case 'cclose':{const [id,how]=g.split(':');const c=campaigns.find(x=>x.id===+id);c.status='closed';S.sheet=null;toast(how==='fund'?'أُغلق التبرع وحُوّل المتبقي إلى الصندوق':'أُغلق التبرع واحتُفظ بالمتبقي');return}
    case 'eact':S.flow.act=g;render(true);return;
    case 'esrc':S.flow.src=g;render(true);return;
    case 'esave':{const F=S.flow;expenses.unshift({act:F.act,amt:+F.amt,date:'اليوم',note:F.note||F.act,src:F.src});feed.unshift({ic:'bad',i:I.receipt,t:'مصروف: '+F.act+' • '+(+F.amt).toLocaleString('en-US'),s:'الآن'});S.flow=null;toast('سُجّل المصروف وتحدّث الرصيد');return}
    default:return;
  }
  render(a==='filter'||a==='view');
});
document.addEventListener('input',e=>{
  const k=e.target.dataset.in;if(!k)return;const v=e.target.value;const F=S.flow;
  const map={q:()=>{S.q=v;render(true)},fq:()=>{F.q=v;render(true)},payer:()=>{F.payer=v},pnote:()=>{F.note=v},ct:()=>{F.title=v;render(true)},cp:()=>{F.purpose=v},cg:()=>{F.target=v.replace(/\D/g,'');render(true)},cd:()=>{F.deadline=v},cf:()=>{F.fixed=v.replace(/\D/g,'')},pa:()=>{F.pg.A=v.replace(/\D/g,'')},pb:()=>{F.pg.B=v.replace(/\D/g,'')},ea:()=>{F.amt=v.replace(/\D/g,'');render(true)},da:()=>{F.don.amt=v.replace(/\D/g,'');render(true)},shot:()=>{F.shot=v.replace(/\D/g,'');render(true)},ref:()=>{F.ref=v.replace(/\D/g,'');render(true)},rw:()=>{S.rw=v.replace(/\D/g,'');render(true)},en:()=>{F.note=v}};
  map[k]&&map[k]();
});
document.addEventListener('change',e=>{
  if(!e.target.dataset.file||!e.target.files[0])return;const r=new FileReader();r.onload=()=>{S.flow.img=r.result;if(S.flow.type==='pay')readShot();else render(true)};r.readAsDataURL(e.target.files[0]);
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&S.sheet){S.sheet=null;render(true)}});
render();
const sp=document.createElement('div');sp.className='splash';sp.innerHTML='<img src="logo.jpg" alt=""><h2>صندوق البقيع</h2><p>رابطة شباب قرية البقيع</p><p class="tag">تعاون • نجاح • تميّز</p>';phone.appendChild(sp);setTimeout(()=>{sp.classList.add('gone');setTimeout(()=>sp.remove(),450)},1300);

})();
</script>
